name: Add course images

on:
  issues:
    types: [reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-images:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Trigger image import'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download exact image files
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-021c-81f5-b884-a5bd2b00fa09/raw?se=2026-09-15T15%3A46%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=27fbd90d-e453-5e9a-be0a-0fe27375819a&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T13%3A28%3A18Z&ske=2026-09-16T13%3A28%3A18Z&sks=b&skv=2026-02-06&sig=F7jLUSI6Zrf3eLKlif3q4sfdjLHjDZ9iFAze%2BNMskb4%3D' -o 1.jpg
          curl -L --fail --retry 3 'https://sdmntprwestus.oaiusercontent.com/files/00000000-5fe4-8230-b0d3-4659d3a70dd1/raw?se=2026-09-15T15%3A46%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=4aa8e1a2-dae1-52bb-898e-fe56a1917387&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T15%3A22%3A02Z&ske=2026-09-16T15%3A22%3A02Z&sks=b&skv=2026-02-06&sig=GdKQENnHWEiqohJv%2BjR07kJZedjHyblCkXDvCGqz4DQ%3D' -o 2.jpg
          curl -L --fail --retry 3 'https://sdmntprwestus.oaiusercontent.com/files/00000000-90b0-8230-b6f4-2a7975508702/raw?se=2026-09-15T15%3A46%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=c9d6447a-1bf6-536b-835a-a7f9b1bf47df&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A22%3A16Z&ske=2026-09-15T20%3A22%3A16Z&sks=b&skv=2026-02-06&sig=1L7ck4zfz3MmetAsneWuTorKeRkoNK3fecPOzVZH23Q%3D' -o 3.jpg
          curl -L --fail --retry 3 'https://sdmntprcacentral.oaiusercontent.com/files/00000000-0030-820d-9d4d-fa0ce1f1894c/raw?se=2026-09-15T15%3A46%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=ac808d47-d349-5e44-b0f7-824c3dcfca92&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T15%3A22%3A11Z&ske=2026-09-16T15%3A22%3A11Z&sks=b&skv=2026-02-06&sig=Ws021N0ckD62iecGu1gtcXqH/ifZNZt8byu/XWzVHzQ%3D' -o 4.jpg
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-31fc-8211-9c99-c75e90168dc6/raw?se=2026-09-15T15%3A46%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=9c7f9f3d-e8f5-58da-aff6-5139b732588f&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T14%3A41%3A14Z&ske=2026-09-16T14%3A41%3A14Z&sks=b&skv=2026-02-06&sig=H4DUwmAxtx2byxZpzeN21abBMTsQ5sznbHfTghK2%2BW4%3D' -o 5.jpg

      - name: Verify exact image files
        shell: bash
        run: |
          set -euo pipefail
          cat > checksums.sha256 <<'EOF'
          bd3d2c6622d8aa10aa23a610eef809d36520bd1b8f9ebe87b0813f0e8fca6746  1.jpg
          e7737b45078ffecb47efe5398ecd0d35a3bca918f9fe21774d095c984d8418dc  2.jpg
          d482ce9fea81f5974e336cd5fea33cc45448846db6691edf445fe72dfbf2d493  3.jpg
          e8e89994e669be5d2cf8b2be19fd63f8b2c8b36541aefff67fb7486db77fe422  4.jpg
          361cc6d35d4850b860f167cfcce2b6103adcc1a41925f2ef3945c12cc0a6b62a  5.jpg
          EOF
          sha256sum -c checksums.sha256
          rm checksums.sha256

      - name: Commit images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 1.jpg 2.jpg 3.jpg 4.jpg 5.jpg
          git commit -m 'Add whiteboard images'
          git push origin HEAD:main
